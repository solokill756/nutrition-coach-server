name: CI

on:
  pull_request:
  push:
    branches: [master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Type check
        run: npx tsc -p tsconfig.build.json --noEmit

      - name: Test
        run: npm test -- --ci

      - name: Build
        run: npm run build

      - name: Security audit (production deps)
        run: npm audit --omit=dev --audit-level=high
