# docling-serve for the RAG knowledge-base ingest pipeline.
#   docker compose -f docker-compose.rag.yml up -d docling
# The client (src/rag-ingest/docling.client.ts) points at DOCLING_URL
# (default http://localhost:5001) and sends do_ocr=false on every request;
# docling-serve v1.37.0 has no env var for a server-side OCR default.
services:
  docling:
    image: quay.io/docling-project/docling-serve-cpu:v1.37.0
    ports:
      - "5001:5001"
    mem_limit: 4g
    environment:
      # one uvicorn worker and one local conversion worker: models are loaded per worker
      UVICORN_WORKERS: "1"
      DOCLING_SERVE_ENG_LOC_NUM_WORKERS: "1"
      # Long PDFs. These caps MUST stay at or below the client's DOCLING_TIMEOUT_MS / 1000
      # (default 3600000 ms = 3600 s). docling-serve never cancels a task the client gave up on;
      # with one worker, a server cap above the client deadline lets an abandoned conversion
      # keep running and the next ingest job queues behind it. Lower these if you lower
      # DOCLING_TIMEOUT_MS. (Defaults were: max_document_timeout 7 days, max_sync_wait 120 s.)
      DOCLING_SERVE_MAX_DOCUMENT_TIMEOUT: "3500"
      DOCLING_SERVE_MAX_SYNC_WAIT: "3500"
    restart: unless-stopped
